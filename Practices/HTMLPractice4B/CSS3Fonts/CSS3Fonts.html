<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts</title>

<style type="text/css">

@font-face{
	font-family:'RetroLetter';
	src: url('fonts/RetroLetter.eot'); 
	src: local('RetroLetter'), url('fonts/RetroLetter.ttf') format('truetype') ;
   
}



p{
	font-family:RetroLetter,Geneva,serif;
	font-size: 36px;

}

</style>


</head>
<body>

<p>
	This is the RetroLetter font. I think it is pretty neat.
</p>



</body></html>
